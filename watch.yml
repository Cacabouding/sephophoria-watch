name: Surveillance revente SEPHORiA

on:
  schedule:
    # Relance toutes les heures ; chaque execution surveille pendant 55 minutes
    # en verifiant la page toutes les 30 secondes => couverture quasi continue.
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sephoria-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          python -m playwright install --with-deps chromium

      - name: Surveiller la billetterie
        env:
          WATCH_URL: "https://widget.weezevent.com/ticket/resale-sephoria-london-2026?locale=en-gb"
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INTERVAL_SECONDS: "30"
          RUN_SECONDS: "3300"
          WANTED_TICKETS: "2"
        run: python monitor.py

      - name: Sauvegarder l'etat
        if: always()
        run: |
          git config user.name "sephoria-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json || true
          git diff --staged --quiet || git commit -m "etat $(date -u +%H:%M)"
          git pull --rebase --autostash || true
          git push || true
